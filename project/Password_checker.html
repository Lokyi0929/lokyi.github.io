<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Strength Checker</title>
  <link rel=icon href=logo.png type=image/jpg>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">Password Strength Checker</h2>

    <label class="block text-sm font-medium text-gray-700">Enter Email</label>
    <input type="abc123@gmail.com"
           class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <label for="password" class="block text-sm font-medium text-gray-700">Enter Password</label>
    <input type="password" id="password" name="password"
           class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <!-- Password Requirements -->
    <ul class="text-sm text-gray-600 mt-2 list-disc list-inside space-y-1">
      <li>At least 8 characters long</li>
      <li>At least one uppercase letter (A–Z)</li>
      <li>At least one lowercase letter (a–z)</li>
      <li>At least one number (0–9)</li>
      <li>At least one symbol (e.g., !, @, #, $)</li>
    </ul>

    <!-- Strength bar -->
    <div id="strengthBar" class="h-2 mt-4 rounded-lg bg-gray-300">
      <div id="strengthFill" class="h-full w-0 rounded-lg bg-red-500 transition-all duration-300"></div>
    </div>
    <p id="strengthText" class="text-sm mt-2 text-gray-600">Strength: </p>
  </div>

  <script>
    const password = document.getElementById('password');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');

    password.addEventListener('input', () => {
      const val = password.value;
      let score = 0;

      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[\W]/.test(val)) score++;

      const strengths = ["Very Weak", "Weak", "Fair", "Good", "Strong", "Very Strong"];
      const colors = ["bg-red-500", "bg-orange-500", "bg-yellow-400", "bg-yellow-500", "bg-green-500", "bg-green-700"];

      let widthPercent = (score / 5) * 100;
      strengthFill.style.width = widthPercent + "%";
      strengthFill.className = `h-full rounded-lg transition-all duration-300 ${colors[score] || "bg-gray-300"}`;
      strengthText.textContent = `Strength: ${strengths[score] || "Unknown"}`;
    });
  </script>
</body>
</html>
